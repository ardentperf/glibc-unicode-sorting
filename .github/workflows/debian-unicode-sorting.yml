name: Debian Unicode Sorting

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:
    inputs:
      debian:
        description: Debian major version, or all
        required: false
        default: sid
        type: string
      language:
        description: Language, or all
        required: false
        default: all
        type: choice
        options: [all, C/root, en, ja, zh, ko, ru, fr, de, es, ar]
      engine:
        description: Collation engine, or all
        required: false
        default: all
        type: choice
        options: [all, glibc, icu]
      architecture:
        description: Architecture, or all
        required: false
        default: x86_64
        type: choice
        options: [all, x86_64, aarch64]

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.matrix.outputs.tests }}
    steps:
      - id: matrix
        name: Build test matrix
        env:
          DEBIAN: ${{ github.event.inputs.debian || inputs.debian || 'sid' }}
          LANGUAGE: ${{ github.event.inputs.language || inputs.language || 'all' }}
          ENGINE: ${{ github.event.inputs.engine || inputs.engine || 'all' }}
          ARCHITECTURE: ${{ github.event.inputs.architecture || inputs.architecture || 'x86_64' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          debian = ["7", "8", "9", "10", "11", "12", "13"]
          languages = {
              "C/root": ("C.UTF-8", "und"),
              "en": ("en_US.UTF-8", "en-US"),
              "ja": ("ja_JP.UTF-8", "ja-JP"),
              "zh": ("zh_CN.UTF-8", "zh-Hans-CN"),
              "ko": ("ko_KR.UTF-8", "ko-KR"),
              "ru": ("ru_RU.UTF-8", "ru-RU"),
              "fr": ("fr_FR.UTF-8", "fr-FR"),
              "de": ("de_DE.UTF-8", "de-DE"),
              "es": ("es_ES.UTF-8", "es-ES"),
              "ar": ("ar_SA.UTF-8", "ar-SA"),
          }
          engines = ["glibc", "icu"]
          architectures = {"x86_64": "ubuntu-latest", "aarch64": "ubuntu-24.04-arm"}
          ds = debian if os.environ["DEBIAN"] == "all" else [os.environ["DEBIAN"]]
          ls = list(languages) if os.environ["LANGUAGE"] == "all" else [os.environ["LANGUAGE"]]
          es = engines if os.environ["ENGINE"] == "all" else [os.environ["ENGINE"]]
          ars = list(architectures) if os.environ["ARCHITECTURE"] == "all" else [os.environ["ARCHITECTURE"]]
          tests = []
          for d in ds:
              for lang in ls:
                  for engine in es:
                      for architecture in ars:
                          if engine == "icu" and d.isdigit() and int(d) <= 9:
                              continue
                          # PostgreSQL's Debian 7/8 aarch64 build rejects work_mem = '3GB' with:
                          # "3145728 is outside the valid range for parameter \"work_mem\" (64 .. 2097151)"
                          # On a GitHub aarch64 runner, even with work_mem = '2097151kB',
                          # the checksum query fails with:
                          # "out of memory" / "Failed on request of size 223069868."
                          if architecture == "aarch64" and d.isdigit() and int(d) <= 8:
                              continue
                          glibc, icu = languages[lang]
                          if lang == "C/root" and engine == "glibc" and d == "sid":
                              glibc = "C.utf8"
                          tests.append({
                              "debian": d,
                              "language": lang,
                              "engine": engine,
                              "architecture": architecture,
                              "runner": architectures[architecture],
                              "locale": glibc if engine == "glibc" else icu + "-x-icu",
                          })
          print("tests=" + json.dumps(tests, separators=(",", ":")))
          PY

  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.matrix.outputs.tests) }}
    runs-on: ${{ matrix.test.runner }}
    name: Debian ${{ matrix.test.debian }} / ${{ matrix.test.language }} / ${{ matrix.test.engine }} / ${{ matrix.test.architecture }}
    steps:
      - uses: actions/checkout@v4

      - name: Read expected checksum
        id: expected
        run: |
          lookup="$(DEBIAN='${{ matrix.test.debian }}' LANGUAGE='${{ matrix.test.language }}' ENGINE='${{ matrix.test.engine }}' ARCHITECTURE='${{ matrix.test.architecture }}' python3 - <<'PY'
          import os

          debian = os.environ['DEBIAN']
          language = os.environ['LANGUAGE']
          engine = os.environ['ENGINE']
          architecture = os.environ['ARCHITECTURE']
          rows = {}
          with open('testdata/debian-md5sums.tsv', encoding='utf-8') as f:
              for line in f:
                  if line.strip() and not line.startswith('#'):
                      fields = line.rstrip('\n').split('\t')
                      if len(fields) < 5:
                          continue
                      d, a, l, e, md5 = fields[:5]
                      rows[(d, a, l, e)] = md5

          architectures = [architecture] if architecture == 'x86_64' else [architecture, 'x86_64']
          lookup_language = ('C' if engine == 'glibc' else 'root') if language == 'C/root' else language
          languages = [lookup_language] if language == 'en' or language == 'C/root' else [lookup_language, 'en']
          for a in architectures:
              for d in [debian, '13']:
                  for l in languages:
                      value = rows.get((d, a, l, engine))
                      if value:
                          print(value + '|' + '\t'.join((d, a, l, engine)))
                          raise SystemExit
          PY
          )"
          value="${lookup%%|*}"
          source="${lookup#*|}"
          requested="$(printf '%s\t%s\t%s\t%s' '${{ matrix.test.debian }}' '${{ matrix.test.architecture }}' '${{ matrix.test.language }}' '${{ matrix.test.engine }}')"
          if [ -z "$value" ]; then
            echo "No expected checksum found; running without comparison"
          elif [ "$source" != "$requested" ]; then
            echo '============================================================'
            echo "CHECKSUM FALLBACK USED: requested ${{ matrix.test.debian }}/${{ matrix.test.architecture }}/${{ matrix.test.language }}/${{ matrix.test.engine }}"
            echo "CHECKSUM FALLBACK SOURCE: $source"
            echo '============================================================'
            echo "::warning::Checksum fallback used from $source"
          fi
          echo "md5=$value" >> "$GITHUB_OUTPUT"

      - name: Build test image
        run: |
          # Use unique lowercase tags for concurrent act jobs; Docker requires lowercase repository names.
          image="unicode-sorting-debian-${{ matrix.test.debian }}-${{ matrix.test.language }}-${{ matrix.test.engine }}-${{ matrix.test.architecture }}"
          image="${image,,}"
          image="${image//\//-}"
          docker build \
            --file Dockerfile.debian \
            --build-arg DEBIAN_TAG="${{ matrix.test.debian }}" \
            --build-arg LOCALE="${{ matrix.test.locale }}" \
            --build-arg ENGINE="${{ matrix.test.engine }}" \
            --build-arg EXPECTED_MD5="${{ steps.expected.outputs.md5 }}" \
            -t "$image" .

      - name: Run checksum test
        run: |
          image="unicode-sorting-debian-${{ matrix.test.debian }}-${{ matrix.test.language }}-${{ matrix.test.engine }}-${{ matrix.test.architecture }}"
          image="${image,,}"
          image="${image//\//-}"
          set +e
          docker run --rm "$image" | tee docker-output.log
          container_status=${PIPESTATUS[0]}
          set -e
          md5="$(sed -n 's/.* md5=\([0-9a-f][0-9a-f]*\) expected=.*/\1/p' docker-output.log | tail -1)"
          test -n "$md5" || { echo 'Checksum was not emitted' >&2; exit 1; }
          echo "Computed checksum: $md5" >> "$GITHUB_STEP_SUMMARY"
          exit "$container_status"
