name: Builtin Unicode sorting

on:
  workflow_dispatch:
    inputs:
      pg:
        description: PostgreSQL major version, or all
        required: false
        default: all
        type: choice
        options: [all, '14', '15', '16', '17', '18', '19']
      locale:
        description: Builtin collation, or all
        required: false
        default: all
        type: choice
        options: [all, C, ucs_basic, pg_c_utf8, pg_unicode_fast]
      architecture:
        description: Architecture, or all
        required: false
        default: all
        type: choice
        options: [all, x86_64]

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.matrix.outputs.tests }}
    steps:
      - id: matrix
        name: Build test matrix
        env:
          PG: ${{ github.event.inputs.pg || inputs.pg || 'all' }}
          LOCALE: ${{ github.event.inputs.locale || inputs.locale || 'all' }}
          ARCHITECTURE: ${{ github.event.inputs.architecture || inputs.architecture || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          versions = ["14", "15", "16", "17", "18", "19"]
          locales = {
              "C": range(14, 20),
              "ucs_basic": range(14, 20),
              "pg_c_utf8": range(17, 20),
              "pg_unicode_fast": range(18, 20),
          }
          architectures = {"x86_64": "ubuntu-latest"}

          selected_versions = (
              versions if os.environ["PG"] == "all" else [os.environ["PG"]]
          )
          selected_locales = (
              list(locales) if os.environ["LOCALE"] == "all" else [os.environ["LOCALE"]]
          )
          selected_architectures = (
              list(architectures)
              if os.environ["ARCHITECTURE"] == "all"
              else [os.environ["ARCHITECTURE"]]
          )

          tests = []
          for pg in selected_versions:
              for locale in selected_locales:
                  if int(pg) not in locales[locale]:
                      continue
                  for architecture in selected_architectures:
                      tests.append({
                          "pg": pg,
                          "locale": locale,
                          "architecture": architecture,
                          "runner": architectures[architecture],
                      })

          print("tests=" + json.dumps(tests, separators=(",", ":")))
          PY

  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.matrix.outputs.tests) }}
    runs-on: ${{ matrix.test.runner }}
    name: PostgreSQL ${{ matrix.test.pg }} / ${{ matrix.test.locale }} / ${{ matrix.test.architecture }}
    steps:
      - uses: actions/checkout@v4

      - name: Read expected checksum
        id: expected
        run: |
          value="$(PG='${{ matrix.test.pg }}' ARCHITECTURE='${{ matrix.test.architecture }}' LOCALE='${{ matrix.test.locale }}' python3 - <<'PY'
          import os

          requested = (
              os.environ['PG'],
              os.environ['ARCHITECTURE'],
              os.environ['LOCALE'],
          )
          with open('testdata/builtin-md5sums.tsv', encoding='utf-8') as f:
              for line in f:
                  if line.strip() and not line.startswith('#'):
                      fields = line.rstrip('\n').split('\t')
                      if len(fields) >= 4 and tuple(fields[:3]) == requested:
                          print(fields[3])
                          break
          PY
          )"
          if [ -z "$value" ]; then
            echo "No expected checksum found for ${{ matrix.test.pg }}/${{ matrix.test.architecture }}/${{ matrix.test.locale }}" >&2
            exit 1
          fi
          echo "md5=$value" >> "$GITHUB_OUTPUT"

      - name: Build test image
        run: |
          docker build \
            --platform linux/amd64 \
            --file Dockerfile.builtin \
            --build-arg PG_MAJOR="${{ matrix.test.pg }}" \
            --build-arg LOCALE="${{ matrix.test.locale }}" \
            --build-arg EXPECTED_MD5="${{ steps.expected.outputs.md5 }}" \
            -t "unicode-sorting-builtin-${{ matrix.test.pg }}-${{ matrix.test.locale }}" .

      - name: Run checksum test
        run: |
          set +e
          docker run --rm "unicode-sorting-builtin-${{ matrix.test.pg }}-${{ matrix.test.locale }}" | tee docker-output.log
          container_status=${PIPESTATUS[0]}
          set -e
          md5="$(sed -n 's/.* md5=\([0-9a-f][0-9a-f]*\) expected=.*/\1/p' docker-output.log | tail -1)"
          test -n "$md5" || { echo 'Checksum was not emitted' >&2; exit 1; }
          echo "Computed checksum: $md5" >> "$GITHUB_STEP_SUMMARY"
          exit "$container_status"
