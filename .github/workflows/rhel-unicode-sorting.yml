name: RHEL Unicode sorting

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:
    inputs:
      rhel:
        description: RHEL major version, or all
        required: false
        default: all
        type: choice
        options: [all, '8', '9', '10']
      language:
        description: Language, or all
        required: false
        default: all
        type: choice
        options: [all, C/root, en, ja, zh, ko, ru, fr, de, es, ar]
      engine:
        description: Collation engine, or all
        required: false
        default: all
        type: choice
        options: [all, glibc, icu]
      architecture:
        description: Architecture, or all
        required: false
        default: x86_64
        type: choice
        options: [all, x86_64, aarch64]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        rhel: [8, 9, 10]
        language: [en]
        engine: [icu]
        architecture: [x86_64]
    runs-on: ubuntu-latest
    name: RHEL ${{ matrix.rhel }} / ${{ matrix.language }} / ${{ matrix.engine }} / ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Build UBI test image
        run: |
          docker build --file Dockerfile.rhel \
            --build-arg RHEL_MAJOR="${{ matrix.rhel }}" \
            --build-arg LOCALE="en-US-x-icu" \
            --build-arg ENGINE="${{ matrix.engine }}" \
            -t unicode-sorting-rhel-test .
      - name: Run checksum test
        run: docker run --rm unicode-sorting-rhel-test
